name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 0.2.0'
        required: true
        default: '0.2.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue plugin
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          npm install
          npm run build

      - name: Fetch Neovim release
        id: nvim
        run: |
          REL=$(curl -fsSL https://api.github.com/repos/neovim/neovim/releases/latest)
          TAG=$(printf '%s' "$REL" | jq -r '.tag_name')
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build both architecture packages
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          NVIM_VERSION='${{ steps.nvim.outputs.VERSION }}'
          REL=$(curl -fsSL https://api.github.com/repos/neovim/neovim/releases/latest)

          for pair in "amd64 x86_64" "arm64 arm64"; do
            set -- $pair
            DEB_ARCH="$1"
            NVIM_ARCH="$2"
            PKG_NAME="neovim-${VERSION}-1+mos-plugin_${DEB_ARCH}"
            PKG_DIR="${PKG_NAME}"
            ASSET="nvim-linux-${NVIM_ARCH}.tar.gz"
            URL=$(printf '%s' "$REL" | jq -r --arg n "$ASSET" '.assets[] | select(.name == $n) | .browser_download_url' | head -n1)
            DIGEST=$(printf '%s' "$REL" | jq -r --arg n "$ASSET" '.assets[] | select(.name == $n) | .digest // empty' | head -n1)
            [ -n "$URL" ] || { echo "no $ASSET" >&2; exit 1; }

            mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin/plugins" "${PKG_DIR}/usr/lib" "${PKG_DIR}/usr/share/neovim-plugin" "${PKG_DIR}/var/www/mos-plugins/neovim"
            curl -fsSL "$URL" -o "/tmp/${ASSET}"
            if [ -n "$DIGEST" ]; then
              case "$DIGEST" in sha256:*) DIGEST="${DIGEST#sha256:}" ;; esac
              printf '%s  %s\n' "$DIGEST" "/tmp/${ASSET}" | sha256sum -c - >/dev/null
            fi
            mkdir -p "${PKG_DIR}/usr/lib/neovim"
            tar -xzf "/tmp/${ASSET}" -C "${PKG_DIR}/usr/lib/neovim" --strip-components=1 --no-same-owner
            chmod 0755 "${PKG_DIR}/usr/lib/neovim/bin/nvim"

            cp neovim-backend "${PKG_DIR}/usr/bin/plugins/neovim"
            chmod 0755 "${PKG_DIR}/usr/bin/plugins/neovim"
            cp neovim-wrapper "${PKG_DIR}/usr/bin/nvim"
            chmod 0755 "${PKG_DIR}/usr/bin/nvim"
            cp neovim-backend "${PKG_DIR}/usr/share/neovim-plugin/"
            cp neovim-wrapper "${PKG_DIR}/usr/share/neovim-plugin/"
            cp functions settings.json "${PKG_DIR}/usr/share/neovim-plugin/"
            chmod 0755 "${PKG_DIR}/usr/share/neovim-plugin/neovim-backend" "${PKG_DIR}/usr/share/neovim-plugin/neovim-wrapper" "${PKG_DIR}/usr/share/neovim-plugin/functions"
            cp -R page/dist/neovim/. "${PKG_DIR}/var/www/mos-plugins/neovim/"
            cp images/neovim.png "${PKG_DIR}/var/www/mos-plugins/neovim/icon.png"

            cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: neovim-plugin
          Version: ${VERSION}-1+mos-plugin
          Architecture: ${DEB_ARCH}
          Maintainer: hustyanzu
          Section: utils
          Priority: optional
          Description: Neovim plugin for MOS
           Vim-based text editor with persistent config on MOS.
          EOF

            cat > "${PKG_DIR}/DEBIAN/postinst" << 'EOF'
          #!/bin/bash
          set -e
          PLG=/boot/optional/plugins/neovim
          SHARE=/usr/share/neovim-plugin
          mkdir -p "$PLG/config" "$PLG/data"
          chmod 0755 /usr/bin/plugins/neovim /usr/bin/nvim 2>/dev/null || true
          for f in neovim-backend neovim-wrapper functions; do
            cp -f "$SHARE/$f" "$PLG/$f"
          done
          chmod 0755 "$PLG/neovim-backend" "$PLG/neovim-wrapper" "$PLG/functions" 2>/dev/null || true
          if [ ! -f "$PLG/settings.json" ]; then
            cp -f "$SHARE/settings.json" "$PLG/settings.json"
          fi
          exit 0
          EOF
            chmod 0755 "${PKG_DIR}/DEBIAN/postinst"

            cat > "${PKG_DIR}/DEBIAN/postrm" << 'EOF'
          #!/bin/bash
          rm -rf /usr/lib/neovim
          exit 0
          EOF
            chmod 0755 "${PKG_DIR}/DEBIAN/postrm"

            dpkg-deb --build --root-owner-group "${PKG_DIR}" "${PKG_DIR}.deb"
            md5sum "${PKG_DIR}.deb" | awk '{print $1}' > "${PKG_DIR}.deb.md5"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Neovim ${{ steps.version.outputs.VERSION }}
          body: |
            ## Neovim MOS plugin ${{ steps.version.outputs.VERSION }}

            The Neovim ${{ steps.nvim.outputs.VERSION }} release tree is embedded in the architecture-specific .deb.
            Install the plugin from the MOS Hub; the plugin page manages config and data only.
          files: |
            neovim-${{ steps.version.outputs.VERSION }}-1+mos-plugin_amd64.deb
            neovim-${{ steps.version.outputs.VERSION }}-1+mos-plugin_amd64.deb.md5
            neovim-${{ steps.version.outputs.VERSION }}-1+mos-plugin_arm64.deb
            neovim-${{ steps.version.outputs.VERSION }}-1+mos-plugin_arm64.deb.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}